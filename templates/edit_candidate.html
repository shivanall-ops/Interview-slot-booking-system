{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h2>Edit Candidate</h2>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }}">{{ message }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('main.edit_candidate', user_id=candidate.id) }}">
        <div class="form-group">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" class="form-control" value="{{ candidate.name }}" required>
        </div>
        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" class="form-control" value="{{ candidate.email }}" required>
        </div>
        <button type="submit" class="btn btn-primary">Update Candidate</button>
        <a href="{{ url_for('main.manage_candidates') }}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
