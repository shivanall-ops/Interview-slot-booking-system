{% extends "base.html" %}

{% block content %}
<div class="auth-container">
    <h2>Edit Interview Slot</h2>
    <form method="POST" action="{{ url_for('main.edit_slot', slot_id=slot.id) }}">
        <div class="form-group">
            <label for="license_id">License:</label>
            <select id="license_id" name="license_id" required>
                {% for license in licenses %}
                <option value="{{ license.id }}" {% if slot.license_id == license.id %}selected{% endif %}>{{ license.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label for="interview_date">Interview Date:</label>
            <input type="date" id="interview_date" name="interview_date" value="{{ slot.interview_date }}" required>
        </div>
        <div class="form-group">
            <label for="start_time">Start Time:</label>
            <select id="start_time" name="start_time" required>
                <option value="">-- Select Start Time --</option>
                <option value="09:00 AM" {% if slot.start_time == '09:00 AM' %}selected{% endif %}>09:00 AM</option>
                <option value="09:30 AM" {% if slot.start_time == '09:30 AM' %}selected{% endif %}>09:30 AM</option>
                <option value="10:00 AM" {% if slot.start_time == '10:00 AM' %}selected{% endif %}>10:00 AM</option>
                <option value="10:30 AM" {% if slot.start_time == '10:30 AM' %}selected{% endif %}>10:30 AM</option>
                <option value="11:00 AM" {% if slot.start_time == '11:00 AM' %}selected{% endif %}>11:00 AM</option>
                <option value="11:30 AM" {% if slot.start_time == '11:30 AM' %}selected{% endif %}>11:30 AM</option>
                <option value="12:00 PM" {% if slot.start_time == '12:00 PM' %}selected{% endif %}>12:00 PM</option>
                <option value="12:30 PM" {% if slot.start_time == '12:30 PM' %}selected{% endif %}>12:30 PM</option>
                <option value="01:00 PM" {% if slot.start_time == '01:00 PM' %}selected{% endif %}>01:00 PM</option>
                <option value="01:30 PM" {% if slot.start_time == '01:30 PM' %}selected{% endif %}>01:30 PM</option>
                <option value="02:00 PM" {% if slot.start_time == '02:00 PM' %}selected{% endif %}>02:00 PM</option>
                <option value="02:30 PM" {% if slot.start_time == '02:30 PM' %}selected{% endif %}>02:30 PM</option>
                <option value="03:00 PM" {% if slot.start_time == '03:00 PM' %}selected{% endif %}>03:00 PM</option>
                <option value="03:30 PM" {% if slot.start_time == '03:30 PM' %}selected{% endif %}>03:30 PM</option>
                <option value="04:00 PM" {% if slot.start_time == '04:00 PM' %}selected{% endif %}>04:00 PM</option>
                <option value="04:30 PM" {% if slot.start_time == '04:30 PM' %}selected{% endif %}>04:30 PM</option>
                <option value="05:00 PM" {% if slot.start_time == '05:00 PM' %}selected{% endif %}>05:00 PM</option>
            </select>
        </div>
        <div class="form-group">
            <label for="end_time">End Time:</label>
            <select id="end_time" name="end_time" required>
                <option value="">-- Select End Time --</option>
                <option value="09:30 AM" {% if slot.end_time == '09:30 AM' %}selected{% endif %}>09:30 AM</option>
                <option value="10:00 AM" {% if slot.end_time == '10:00 AM' %}selected{% endif %}>10:00 AM</option>
                <option value="10:30 AM" {% if slot.end_time == '10:30 AM' %}selected{% endif %}>10:30 AM</option>
                <option value="11:00 AM" {% if slot.end_time == '11:00 AM' %}selected{% endif %}>11:00 AM</option>
                <option value="11:30 AM" {% if slot.end_time == '11:30 AM' %}selected{% endif %}>11:30 AM</option>
                <option value="12:00 PM" {% if slot.end_time == '12:00 PM' %}selected{% endif %}>12:00 PM</option>
                <option value="12:30 PM" {% if slot.end_time == '12:30 PM' %}selected{% endif %}>12:30 PM</option>
                <option value="01:00 PM" {% if slot.end_time == '01:00 PM' %}selected{% endif %}>01:00 PM</option>
                <option value="01:30 PM" {% if slot.end_time == '01:30 PM' %}selected{% endif %}>01:30 PM</option>
                <option value="02:00 PM" {% if slot.end_time == '02:00 PM' %}selected{% endif %}>02:00 PM</option>
                <option value="02:30 PM" {% if slot.end_time == '02:30 PM' %}selected{% endif %}>02:30 PM</option>
                <option value="03:00 PM" {% if slot.end_time == '03:00 PM' %}selected{% endif %}>03:00 PM</option>
                <option value="03:30 PM" {% if slot.end_time == '03:30 PM' %}selected{% endif %}>03:30 PM</option>
                <option value="04:00 PM" {% if slot.end_time == '04:00 PM' %}selected{% endif %}>04:00 PM</option>
                <option value="04:30 PM" {% if slot.end_time == '04:30 PM' %}selected{% endif %}>04:30 PM</option>
                <option value="05:00 PM" {% if slot.end_time == '05:00 PM' %}selected{% endif %}>05:00 PM</option>
                <option value="05:30 PM" {% if slot.end_time == '05:30 PM' %}selected{% endif %}>05:30 PM</option>
            </select>
        </div>
        <div class="form-group">
            <label for="status">Status:</label>
            <select id="status" name="status" required>
                <option value="available" {% if slot.status == 'available' %}selected{% endif %}>Available</option>
                <option value="booked" {% if slot.status == 'booked' %}selected{% endif %}>Booked</option>
                <option value="cancelled" {% if slot.status == 'cancelled' %}selected{% endif %}>Cancelled</option>
            </select>
        </div>
        <button type="submit">Update Slot</button>
    </form>
    <p><a href="{{ url_for('main.hr_dashboard') }}">Back to Dashboard</a></p>
</div>
{% endblock %}
