{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">
            <h3>Create Extra Interview Slot</h3>
        </div>

        <div class="card-body">

            <h5 class="mb-4">
                Candidate :
                <span class="text-primary">{{ candidate.name }}</span>
            </h5>

            <form method="POST">

                <div class="mb-3">
                    <label class="form-label">License</label>
                    <select name="license_id" class="form-control" required>
                        {% for license in licenses %}
                        <option value="{{ license.id }}">
                            {{ license.name }}
                        </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Interview Date</label>
                    <input type="date"
                           name="interview_date"
                           class="form-control"
                           required>
                </div>

                <div class="row">

                    <div class="col-md-6">
                        <label class="form-label">Start Time</label>
                        <input type="time"
                               name="start_time"
                               class="form-control"
                               required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">End Time</label>
                        <input type="time"
                               name="end_time"
                               class="form-control"
                               required>
                    </div>

                </div>

                <div class="mt-3">
                    <label class="form-label">Company Name</label>
                    <input type="text"
                           name="company_name"
                           class="form-control">
                </div>

                <div class="mt-3">
                    <label class="form-label">Technology</label>
                    <input type="text"
                           name="technology"
                           class="form-control">
                </div>

                <div class="mt-3">
                    <label class="form-label">Interview Round</label>

                    <select name="interview_round"
                            class="form-control">

                        <option value="L1">L1</option>
                        <option value="L2">L2</option>
                        <option value="L3">L3</option>
                        <option value="Manager Round">Manager Round</option>
                        <option value="Client Round">Client Round</option>
                        <option value="HR Round">HR Round</option>

                    </select>

                </div>

                <div class="mt-3">
                    <label class="form-label">Remarks</label>
                    <textarea
                        name="remarks"
                        rows="3"
                        class="form-control"></textarea>
                </div>

                <div class="mt-4">

                    <button type="submit"
                            class="btn btn-success">
                        Create & Book Slot
                    </button>

                    <a href="{{ url_for('main.hr_dashboard') }}"
                       class="btn btn-secondary">
                        Cancel
                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
