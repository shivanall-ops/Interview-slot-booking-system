<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BluJay Technologies - Interview Slot Booking System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .landing-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            animation: fadeIn 1s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .landing-logo {
            max-width: 900px;
            width: 100%;
            height: auto;
            margin-bottom: 15px;
            animation: slideDown 0.8s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .landing-title {
            font-size: 48px;
            font-weight: bold;
            color: #ffffff;
            text-align: center;
            margin-bottom: 10px;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.5);
            animation: slideUp 0.8s ease-out 0.2s both;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .landing-subtitle {
            font-size: 24px;
            color: #e0e0e0;
            text-align: center;
            margin-bottom: 25px;
            text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.5);
            animation: slideUp 0.8s ease-out 0.4s both;
        }

        .landing-button {
            padding: 16px 48px;
            font-size: 18px;
            font-weight: 600;
            border-radius: 8px;
            background: linear-gradient(135deg, #007bff 0%, #0056b3 100%);
            color: white;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 123, 255, 0.4);
            animation: slideUp 0.8s ease-out 0.6s both;
        }

        .landing-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0, 123, 255, 0.6);
            background: linear-gradient(135deg, #0056b3 0%, #004494 100%);
        }

        @media (max-width: 768px) {
            .landing-logo {
                max-width: 680px;
            }

            .landing-title {
                font-size: 36px;
            }

            .landing-subtitle {
                font-size: 18px;
            }

            .landing-button {
                padding: 14px 36px;
                font-size: 16px;
            }
        }

        @media (max-width: 480px) {
            .landing-logo {
                max-width: 500px;
            }

            .landing-title {
                font-size: 28px;
            }

            .landing-subtitle {
                font-size: 16px;
            }

            .landing-button {
                padding: 12px 32px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="landing-container">
        <img src="{{ url_for('static', filename='images/blujay_logo.jpg') }}" alt="BluJay Technologies" class="landing-logo img-fluid">
        <h1 class="landing-title">BluJay Technologies</h1>
        <p class="landing-subtitle">Interview Slot Booking System</p>
        <a href="{{ url_for('main.login') }}" class="btn landing-button">
            <i class="fas fa-sign-in-alt me-2"></i>Login
        </a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
