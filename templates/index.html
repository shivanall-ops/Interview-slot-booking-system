<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BluJay Technologies - Interview Slot Booking System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .split-container {
            min-height: 100vh;
            display: flex;
            flex-wrap: wrap;
        }

        .branding-section {
            flex: 0 0 50%;
            max-width: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            animation: fadeInLeft 1s ease-out;
        }

        @keyframes fadeInLeft {
            from {
                opacity: 0;
                transform: translateX(-30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .login-section {
            flex: 0 0 50%;
            max-width: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            animation: fadeInRight 1s ease-out;
        }

        @keyframes fadeInRight {
            from {
                opacity: 0;
                transform: translateX(30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .branding-logo {
            max-width: 400px;
            width: 100%;
            height: auto;
            margin-bottom: 30px;
            animation: slideDown 0.8s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .branding-title {
            font-size: 42px;
            font-weight: bold;
            color: #ffffff;
            text-align: center;
            margin-bottom: 15px;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.8s ease-out 0.2s both;
        }

        .branding-subtitle {
            font-size: 20px;
            color: #e0e0e0;
            text-align: center;
            margin-bottom: 20px;
            text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.8s ease-out 0.4s both;
        }

        .branding-tagline {
            font-size: 16px;
            color: #b0b0b0;
            text-align: center;
            font-style: italic;
            animation: slideUp 0.8s ease-out 0.6s both;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-container {
            max-width: 420px;
            width: 100%;
            padding: 30px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
        }

        .login-container h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
            font-size: 24px;
        }

        .login-container button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .login-container button:hover {
            background-color: #0056b3;
        }

        .login-trigger-button {
            padding: 16px 48px;
            font-size: 18px;
            font-weight: 600;
            border-radius: 8px;
            background: linear-gradient(135deg, #007bff 0%, #0056b3 100%);
            color: white;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 123, 255, 0.4);
        }

        .login-trigger-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0, 123, 255, 0.6);
            background: linear-gradient(135deg, #0056b3 0%, #004494 100%);
        }

        .hidden {
            display: none !important;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: #555;
            font-weight: 600;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            height: 44px;
        }

        .form-group input:focus {
            outline: none;
            border-color: #007bff;
            box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.1);
        }

        .alert {
            padding: 12px 16px;
            margin: 0 0 16px 0;
            border-radius: 6px;
            font-size: 14px;
        }

        .alert-success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .alert-info {
            background-color: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        /* Responsive Design */
        @media (max-width: 992px) {
            .branding-section,
            .login-section {
                flex: 0 0 100%;
                max-width: 100%;
            }

            .branding-section {
                padding: 30px 20px;
                min-height: auto;
            }

            .login-section {
                padding: 30px 20px;
                min-height: auto;
            }

            .branding-logo {
                max-width: 350px;
            }

            .branding-title {
                font-size: 36px;
            }

            .branding-subtitle {
                font-size: 18px;
            }
        }

        @media (max-width: 768px) {
            .branding-logo {
                max-width: 300px;
            }

            .branding-title {
                font-size: 32px;
            }

            .branding-subtitle {
                font-size: 16px;
            }

            .branding-tagline {
                font-size: 14px;
            }

            .login-container {
                padding: 25px;
            }

            .branding-section,
            .login-section {
                padding: 25px 15px;
            }
        }

        @media (max-width: 480px) {
            .branding-logo {
                max-width: 250px;
            }

            .branding-title {
                font-size: 28px;
            }

            .branding-subtitle {
                font-size: 14px;
            }

            .branding-tagline {
                font-size: 13px;
            }

            .login-container {
                padding: 20px;
            }

            .branding-section,
            .login-section {
                padding: 20px 10px;
            }
        }
    </style>
</head>
<body>
    <div class="split-container">
        <!-- Left 50% - Branding -->
        <div class="branding-section">
            <img src="{{ url_for('static', filename='images/blujay_logo.jpg') }}" alt="BluJay Technologies" class="branding-logo img-fluid">
            <h1 class="branding-title">BluJay Technologies</h1>
            <p class="branding-subtitle">Interview Slot Booking System</p>
            <p class="branding-tagline">Innovating the Future of Technology</p>
        </div>

        <!-- Right 50% - Login Form -->
        <div class="login-section">
            <!-- Initial Login Button -->
            <button type="button" id="showLoginBtn" class="login-trigger-button">
                Login
            </button>

            <!-- Login Form (hidden initially) -->
            <div class="login-container hidden" id="loginFormContainer">
                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                        {% for category, message in messages %}
                            <div class="alert alert-{{ category }}">
                                {{ message }}
                            </div>
                        {% endfor %}
                    {% endif %}
                {% endwith %}

                <h2>Login</h2>
                <form method="POST" action="{{ url_for('main.home') }}">
                    <div class="form-group">
                        <label for="email">Email:</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Password:</label>
                        <input type="password" id="password" name="password" required>
                    </div>
                    <button type="submit">Login</button>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const showLoginBtn = document.getElementById('showLoginBtn');
            const loginFormContainer = document.getElementById('loginFormContainer');

            // Check if there are any flash messages (errors/info)
            const hasFlashMessages = document.querySelector('.alert') !== null;

            // If there are flash messages, show the login form automatically
            if (hasFlashMessages) {
                showLoginBtn.classList.add('hidden');
                loginFormContainer.classList.remove('hidden');
            }

            showLoginBtn.addEventListener('click', function() {
                showLoginBtn.classList.add('hidden');
                loginFormContainer.classList.remove('hidden');
            });
        });
    </script>
</body>
</html>
