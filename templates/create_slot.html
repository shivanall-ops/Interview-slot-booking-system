{% extends "base.html" %}

{% block content %}
<div class="auth-container">
    <h2>Create Interview Slot</h2>
    <form method="POST" action="{{ url_for('main.create_slot') }}">
        <div class="form-group">
            <label for="license_id">License:</label>
            <select id="license_id" name="license_id" required>
                <option value="">-- Select a license --</option>
                {% for license in licenses %}
                <option value="{{ license.id }}">{{ license.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label for="interview_date">Interview Date:</label>
            <input type="date" id="interview_date" name="interview_date" required>
        </div>
        <div class="form-group">
            <label for="start_time">Start Time:</label>
            <select id="start_time" name="start_time" required>
                <option value="">-- Select Start Time --</option>
                <option value="09:00 AM">09:00 AM</option>
                <option value="09:30 AM">09:30 AM</option>
                <option value="10:00 AM">10:00 AM</option>
                <option value="10:30 AM">10:30 AM</option>
                <option value="11:00 AM">11:00 AM</option>
                <option value="11:30 AM">11:30 AM</option>
                <option value="12:00 PM">12:00 PM</option>
                <option value="12:30 PM">12:30 PM</option>
                <option value="01:00 PM">01:00 PM</option>
                <option value="01:30 PM">01:30 PM</option>
                <option value="02:00 PM">02:00 PM</option>
                <option value="02:30 PM">02:30 PM</option>
                <option value="03:00 PM">03:00 PM</option>
                <option value="03:30 PM">03:30 PM</option>
                <option value="04:00 PM">04:00 PM</option>
                <option value="04:30 PM">04:30 PM</option>
                <option value="05:00 PM">05:00 PM</option>
            </select>
        </div>
        <div class="form-group">
            <label for="end_time">End Time:</label>
            <select id="end_time" name="end_time" required>
                <option value="">-- Select End Time --</option>
                <option value="09:30 AM">09:30 AM</option>
                <option value="10:00 AM">10:00 AM</option>
                <option value="10:30 AM">10:30 AM</option>
                <option value="11:00 AM">11:00 AM</option>
                <option value="11:30 AM">11:30 AM</option>
                <option value="12:00 PM">12:00 PM</option>
                <option value="12:30 PM">12:30 PM</option>
                <option value="01:00 PM">01:00 PM</option>
                <option value="01:30 PM">01:30 PM</option>
                <option value="02:00 PM">02:00 PM</option>
                <option value="02:30 PM">02:30 PM</option>
                <option value="03:00 PM">03:00 PM</option>
                <option value="03:30 PM">03:30 PM</option>
                <option value="04:00 PM">04:00 PM</option>
                <option value="04:30 PM">04:30 PM</option>
                <option value="05:00 PM">05:00 PM</option>
                <option value="05:30 PM">05:30 PM</option>
            </select>
        </div>
        <div class="form-group">
            <label for="status">Status:</label>
            <select id="status" name="status" required>
                <option value="available">Available</option>
                <option value="booked">Booked</option>
                <option value="cancelled">Cancelled</option>
            </select>
        </div>
        <button type="submit">Create Slot</button>
    </form>
    <p><a href="{{ url_for('main.hr_dashboard') }}">Back to Dashboard</a></p>
</div>
{% endblock %}
