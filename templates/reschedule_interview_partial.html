<h3>Reschedule Interview</h3>

<p><strong>Candidate:</strong> {{ booking.user_name }}</p>

<p>
    <strong>Current Slot:</strong>
    {{ booking.interview_date }}
    {{ booking.start_time }} - {{ booking.end_time }}
</p>

<form method="POST">

    <div class="mb-3">
        <label class="form-label">Select Interview Date</label>
        <input type="date"
               id="rescheduleDate"
               class="form-control"
               value="{{ booking.interview_date }}">
    </div>

    <div class="mb-3">
        <label class="form-label">Available Slots</label>

        <select id="new_slot_id"
                name="new_slot_id"
                class="form-control"
                required>

            {% for slot in available_slots %}
            <option value="{{ slot.id }}">
                {{ slot.start_time }} - {{ slot.end_time }}
                ({{ slot.license_name }})
            </option>
            {% endfor %}

        </select>
    </div>

    <button type="submit" class="btn btn-primary">
        Reschedule
    </button>

    <button type="button"
            class="btn btn-secondary"
            data-bs-dismiss="modal">
        Cancel
    </button>

</form>
