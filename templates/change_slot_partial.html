<div class="mb-3">
    <label class="form-label">Select New Interview Date:</label>
    <input type="date"
           id="rescheduleDate"
           class="form-control"
           value="{{ booking.interview_date }}">
</div>

<div id="slotsContainer">
    <p class="text-muted">Select a date above to view available slots.</p>
</div>

<form method="POST" action="{{ url_for('main.candidate_change_slot', booking_id=booking.id) }}" id="changeSlotForm">
    <input type="hidden" id="selectedSlotId" name="new_slot_id" required>

    <button type="submit" class="btn btn-primary" id="confirmChangeBtn" disabled>
        Confirm Change
    </button>

    <button type="button"
            class="btn btn-secondary"
            data-bs-dismiss="modal">
        Cancel
    </button>
</form>
